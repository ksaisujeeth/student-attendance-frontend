<div class="container mt-4">
  <!-- Page Header -->
  <div class="row mb-4">
    <div class="col-md-6">
      <h2>All Students</h2>
    </div>
    <div class="col-md-6 text-end">
      <button class="btn btn-primary" (click)="addNewStudent()">
        <i class="fas fa-plus"></i> Add New Student
      </button>
    </div>
  </div>

  <!-- Loading Message -->
  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading students...</p>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <!-- Students Table -->
  <div *ngIf="!loading && !errorMessage" class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Class</th>
              <th>Gender</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let student of students">
              <td>{{ student.studentId }}</td>
              <td>{{ student.studentName }}</td>
              <td>{{ student.studentClass }}</td>
              <td>{{ student.studentGender === 'M' ? 'Male' : 'Female' }}</td>
              <td>
                <button class="btn btn-sm btn-success me-2" 
                        (click)="viewAttendance(student.studentId!)">
                  <i class="fas fa-calendar-check"></i> Attendance
                </button>
                <button class="btn btn-sm btn-warning me-2" 
                        (click)="editStudent(student.studentId!)">
                  <i class="fas fa-edit"></i> Edit
                </button>
                <button class="btn btn-sm btn-danger" 
                        (click)="deleteStudent(student.studentId!, student.studentName)">
                  <i class="fas fa-trash"></i> Delete
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- No Students Message -->
        <div *ngIf="students.length === 0" class="text-center mt-4">
          <h5>No students found</h5>
          <p>Click "Add New Student" to add your first student.</p>
        </div>
      </div>
    </div>
  </div>
</div>
