<div class="container mt-4">
  <div class="row mb-4">
    <div class="col-md-8">
      <h2>{{ isEditMode ? 'Edit Attendance' : 'Mark Attendance' }}</h2>
    </div>
    <div class="col-md-4 text-end">
      <button class="btn btn-secondary" (click)="goBack()">
        <i class="fas fa-arrow-left"></i> Back to Attendance List
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center mb-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>{{ isEditMode ? 'Loading attendance details...' : 'Saving attendance...' }}</p>
  </div>

  <div *ngIf="successMessage" class="alert alert-success">
    <i class="fas fa-check-circle"></i> {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
  </div>

  <div class="card">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">
        <i class="fas fa-calendar-plus"></i> Attendance Information
      </h5>
    </div>
    <div class="card-body">
      <form #attendanceForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Student Select -->
        <div class="mb-3">
          <label for="studentId" class="form-label">
            <i class="fas fa-user"></i> Student *
          </label>
          <select 
            class="form-select"
            [class.is-invalid]="formErrors.studentId"
            id="studentId"
            name="studentId"
            [(ngModel)]="attendance.studentId">
            <option value="0">Select Student</option>
            <option *ngFor="let student of students" [value]="student.studentId">
              {{ student.studentName }} ({{ student.studentClass }})
            </option>
          </select>
          <div *ngIf="formErrors.studentId" class="invalid-feedback">
            {{ formErrors.studentId }}
          </div>
        </div>

        <!-- Status -->
        <div class="mb-3">
          <label class="form-label">
            <i class="fas fa-check-double"></i> Status *
          </label>
          <div class="form-check-container">
            <div class="form-check form-check-inline" *ngFor="let key of getStatusKeys()">
              <input
                class="form-check-input"
                [class.is-invalid]="formErrors.status"
                type="radio"
                name="status"
                [id]="key"
                [value]="key"
                [(ngModel)]="attendance.status"
              >
              <label class="form-check-label" [for]="key">
                {{ key.charAt(0) + key.slice(1).toLowerCase() }}
              </label>
            </div>
          </div>
          <div *ngIf="formErrors.status" class="text-danger mt-1"><small>{{ formErrors.status }}</small></div>
        </div>

        <!-- Remarks -->
        <div class="mb-4">
          <label for="remarks" class="form-label">
            <i class="fas fa-comment"></i> Remarks
            <span class="small text-muted">(optional, 255 chars max)</span>
          </label>
          <input
            type="text"
            class="form-control"
            id="remarks"
            name="remarks"
            maxlength="255"
            [(ngModel)]="attendance.remarks"
            placeholder="Enter remarks if any">
        </div>

        <div class="d-flex justify-content-between">
          <div>
            <button
              type="submit"
              class="btn btn-primary me-2"
              [disabled]="loading">
              <i class="fas fa-save"></i>
              {{ isEditMode ? 'Update Attendance' : 'Mark Attendance' }}
            </button>
            <button
              type="button"
              class="btn btn-warning"
              (click)="resetForm()"
              [disabled]="loading">
              <i class="fas fa-undo"></i> Reset Form
            </button>
          </div>
          <button
            type="button"
            class="btn btn-secondary"
            (click)="goBack()"
            [disabled]="loading">
            <i class="fas fa-times"></i> Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
