<div class="container mt-4">
  <div class="row mb-4">
    <div class="col-md-8">
      <h2>
        <i class="fas fa-chart-bar text-info"></i>
        Attendance Reports
      </h2>
    </div>
  </div>

  <div class="card">
    <div class="card-header bg-info text-white">
      <h5 class="mb-0">
        <i class="fas fa-search"></i> Find Present Students By Date
      </h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="getPresentStudents()" class="row g-3 align-items-end">
        <div class="col-md-4">
          <label for="date" class="form-label">
            <i class="fas fa-calendar-alt"></i> Select Date *
          </label>
          <input
            type="date"
            class="form-control"
            id="date"
            name="date"
            [(ngModel)]="selectedDate"
            required>
        </div>
        <div class="col-md-2">
          <button class="btn btn-info" type="submit" [disabled]="loading">
            <i class="fas fa-search"></i> Show Present Students
          </button>
        </div>
      </form>

      <div *ngIf="loading" class="text-center mt-3">
        <div class="spinner-border text-info" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p>Fetching attendance report...</p>
      </div>

      <div *ngIf="searched && !loading">
        <div *ngIf="errorMessage" class="alert alert-danger mt-3">
          <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
        </div>

        <div *ngIf="!errorMessage">
          <div class="mt-4">
            <h5>
              Students Present on <span class="text-info">{{ selectedDate }}</span>:
            </h5>
            <ul class="list-group mt-2" *ngIf="presentStudents.length > 0">
              <li class="list-group-item" *ngFor="let name of presentStudents">
                <i class="fas fa-user-check text-success"></i> {{ name }}
              </li>
            </ul>
            <div *ngIf="presentStudents.length === 0" class="text-muted mt-3">
              <i class="fas fa-info-circle"></i> No students marked as present for this date.
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
